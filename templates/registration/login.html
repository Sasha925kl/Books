{% extends "base/base_auth.html" %}


{% block content %}
<div class="auth-container">
    <h2>Увійти</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
    <p>Ще не маєте акаунту? <a href="{% url 'register' %}">Зареєструватися</a></p>
</div>
{% endblock %}
