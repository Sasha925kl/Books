{% extends "base/base_auth.html" %}


{% block content %}
<div class="auth-container">
    <h2>Реєстрація</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
</div>
{% endblock %}
