{% extends "base/base.html" %}

{% load static %}

{% block title %}Зміна пароля{% endblock %}

{% block content %}
<div class="profile-container">
  <h2>🔒 Зміна пароля</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn-save">🔁 Оновити пароль</button>
  </form>

  <a href="{% url 'profile' %}" class="btn-back">↩️ Назад до профілю</a>
</div>
{% endblock %}
